<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Yellow background with subtle rounded corners -->
  <rect width="120" height="120" rx="4" ry="4" fill="#F5C518"/>

  <!-- Starburst / shooting star from upper-left -->
  <!-- Central bright point -->
  <circle cx="30" cy="22" r="2" fill="white"/>

  <!-- Star rays emanating outward -->
  <line x1="30" y1="22" x2="15" y2="5" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="22" x2="5" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="22" x2="10" y2="38" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="22" x2="22" y2="5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="22" x2="48" y2="8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="22" x2="8" y2="28" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Long shooting trail to bottom-right -->
  <line x1="30" y1="22" x2="100" y2="82" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Second thinner trail -->
  <line x1="30" y1="22" x2="95" y2="78" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

  <!-- STAR text -->
  <text x="60" y="100" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" fill="white" text-anchor="middle" letter-spacing="3">STAR</text>

  <!-- LIGHT text -->
  <text x="60" y="116" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" fill="white" text-anchor="middle" letter-spacing="2">LIGHT</text>
</svg>